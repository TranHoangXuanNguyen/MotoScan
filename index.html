<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOTOSCAN TAB WEB</title>
    <meta name="description" content="MOTOSCAN TAB - Motorcycle Diagnostic Tool Web Interface">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="tablet-frame">
        <div class="screen">
            <!-- Screenshot flash -->
            <div class="screenshot-flash" id="screenshotFlash"></div>

            <!-- Toast notification -->
            <div class="toast" id="toast">
                <div class="toast-icon">✓</div>
                <span id="toastText"></span>
            </div>

            <!-- Popup Overlay -->
            <div class="popup-overlay" id="popupOverlay">
                <div class="popup-box">
                    <div class="popup-header">
                        <span id="popupTitle"></span>
                        <button class="popup-close" onclick="closePopup()">✕</button>
                    </div>
                    <div class="popup-body" id="popupBody">
                        <!-- Dynamic content -->
                    </div>
                </div>
            </div>

            <!-- Top Navigation Bar -->
            <div class="top-bar">
                <div class="nav-controls">
                    <button class="nav-btn" onclick="goBack()" title="Quay lại">
                        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                    </button>
                    <button class="nav-btn" onclick="goHome()" title="Home">

                    </button>

                    <div class="sidebar-footer">
                        <b>DTDAuto</b> Copyright © DTDAUTO

                <main class="content-area">
                    <div class="grid-layout" id="gridContent"></div>

            <!-- Footer Status Bar -->
