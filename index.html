<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOTOSCAN TAB WEB</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }


        body {
            background-color: #1e222b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }


        /* Khung viền Tablet giả lập (Ảnh 1) */
        .tablet-frame {
            width: 980px;
            height: 620px;
            background-color: #15181c;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.1);
            border: 3px solid #2a2e3d;
            position: relative;
        }


        .screen {
            width: 100%;
            height: 100%;
            background-color: #dce7f0;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }


        /* Thanh điều hướng phía trên */
        .top-bar {
            height: 38px;
            background: linear-gradient(to bottom, #ffffff, #dbe4ee);
            border-bottom: 1px solid #b0c0d0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
        }


        .nav-controls {
            display: flex;
            gap: 18px;
            align-items: center;
        }


        .nav-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s;
        }


        .nav-btn:hover {
            color: #000;
        }


        .nav-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }


        .version-tag {
            color: #e63946;
            font-weight: bold;
            font-size: 15px;
            font-style: italic;
        }


        /* Thân giao diện chính */
        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }


        /* Sidebar Menu bên trái */
        .sidebar {
            width: 250px;
            background: linear-gradient(to bottom, #093c60, #062740);
            color: white;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #041b2d;
        }


        .brand {
            padding: 15px 12px 10px;
            text-align: center;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 1px;
            color: #38b6ff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }


        .brand span {
            color: #ff9f1c;
            font-size: 11px;
            display: block;
            font-weight: 600;
            margin-top: -2px;
        }


        .menu-list {
            list-style: none;
            margin-top: 5px;
        }


        .menu-item {
            padding: 12px 15px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s, color 0.2s;
            color: #d1e5f4;
        }


        .menu-item:hover {
            background-color: rgba(255,255,255,0.12);
            color: #ffffff;
        }


        .menu-item.active {
            background: linear-gradient(to right, #0077b6, #0096c7);
            color: #ffffff;
            font-weight: bold;
        }


        .menu-item .icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }


        .menu-item .icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }


        .sidebar-footer {
            margin-top: auto;
            padding: 10px;
            font-size: 10px;
            color: #72a1c4;
            border-top: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }


        /* Lưới hiển thị các Chức năng / Hãng xe / Mẫu xe */
        .content-area {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background-color: #e9f1f7;
        }


        .grid-layout {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }


        /* Style từng ô Thẻ (Card) */
        .card {
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #b8cae0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            height: 140px;
            text-align: center;
            position: relative;
        }


        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
            border-color: #0077b6;
        }


        .card:active {
            transform: translateY(0);
            background-color: #f0f7ff;
        }


        .card-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }


        .card-icon svg {
            width: 100%;
            height: 100%;
        }


        .card-title {
            font-size: 13px;
            color: #1a2b3c;
            font-weight: 600;
            line-height: 1.3;
        }


        /* Thanh Trạng thái Footer */
        .status-bar {
            height: 24px;
            background-color: #062740;
            color: #90e0ef;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
        }


        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }


        .dot {
            width: 8px;
            height: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px #2ecc71;
        }


        /* Popup Log Giả lập Sự kiện */
        #log-overlay {
            position: absolute;
            bottom: 35px;
            right: 25px;
            background: rgba(0, 0, 0, 0.85);
            color: #00ff66;
            padding: 8px 14px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            display: none;
            z-index: 100;
            border: 1px solid #00ff66;
        }
    </style>
</head>

        // Dữ liệu các màn hình theo chỉ mục tab
        const viewsData = {
            chanDoan: [
                { id: "obd_conn", title: "Kết nối hệ thống OBD trên xe", iconKey: "obd_conn" },
                { id: "signal_sim", title: "Giả lập và mô phỏng tín hiệu", iconKey: "signal_sim" },
                { id: "battery_check", title: "Kiểm tra ắc quy", iconKey: "battery_check" },
                { id: "power_gen", title: "Kiểm tra phát điện và nạp điện", iconKey: "power_gen" },
                { id: "ecu_sensor", title: "Kiểm tra ECU, cảm biến", iconKey: "ecu_sensor" },
                { id: "auto_prog", title: "Lập trình tự động", iconKey: "auto_prog" },
                { id: "rpm_abs", title: "Đo trực tiếp tốc độ động cơ (RPM), ABS/HSTC", iconKey: "rpm_abs" }
            ],
            nhaSanXuat: [
                { id: "honda", title: "HONDA", iconKey: "honda" },
                { id: "yamaha", title: "YAMAHA", iconKey: "yamaha" },
                { id: "piaggio", title: "PIAGGIO", iconKey: "piaggio" },
                { id: "sym", title: "SYM", iconKey: "sym" },
                { id: "kymco", title: "KYMCO", iconKey: "kymco" }
            ],
            ngonNgu: [
                { id: "lang_vi", title: "Việt Nam", iconKey: "lang_vi" },
                { id: "lang_en", title: "English", iconKey: "lang_en" },
                { id: "lang_fr", title: "Français", iconKey: "lang_fr" },
                { id: "lang_id", title: "Bahasa Indonesia", iconKey: "lang_id" },
                { id: "lang_km", title: "Khmer", iconKey: "lang_km" },
                { id: "lang_ko", title: "한국어", iconKey: "lang_ko" },
                { id: "lang_la", title: "Lao", iconKey: "lang_la" },
                { id: "lang_ms", title: "Bahasa Melayu", iconKey: "lang_ms" }
            ],
            mauXeHonda: [
                { id: "ab_08_10", title: "AIR BLADE\n(2008 - 2010)", iconKey: "scooter" },
                { id: "ab_11_12", title: "AIR BLADE\n(2011 - 2012)", iconKey: "scooter" },
                { id: "ab_18_19", title: "AIR BLADE\n(2018 - 2019)", iconKey: "scooter" },
                { id: "dylan", title: "DYLAN", iconKey: "scooter" }
            ]
        };


        // Hàm tải nội dung Lưới theo chỉ mục tab
        function loadView(viewKey, element) {
            if (element) {
                document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
                element.classList.add('active');
            }


            const grid = document.getElementById('gridContent');
            grid.innerHTML = '';


            const items = viewsData[viewKey] || viewsData['chanDoan'];


            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => onCardClick(item.id, item.title, viewKey);


                const iconSvg = SVG_ICONS[item.iconKey] || SVG_ICONS['obd_conn'];


                card.innerHTML = `
                    <div class="card-icon">${iconSvg}</div>
                    <div class="card-title">${item.title.replace(/\n/g, '<br>')}</div>
                `;
                grid.appendChild(card);
            });
        }


        // Xử lý sự kiện click vào các Ô chức năng (Để gán thuật toán sau này)
        function onCardClick(id, title, viewKey) {
            showLog(`[CLICK] ID: ${id} | Title: ${title.replace('\n', ' ')}`);


            // Luồng chuyển hướng demo
            if (viewKey === 'nhaSanXuat' && id === 'honda') {
                loadView('mauXeHonda');
            } else {
                /*
                   =====================================================
                   KHU VỰC TÍCH HỢP THUẬT TOÁN VÀ KẾT NỐI API SCAN SAU NÀY
                   =====================================================
                */
            }
        }


        function triggerAction(actionName) {
            showLog(`[ACTION] ${actionName}`);
        }


        function goHome() {
            const firstMenuItem = document.querySelector('.menu-item');
            loadView('chanDoan', firstMenuItem);
        }


        function showLog(text) {
            const logBox = document.getElementById('log-overlay');
            logBox.innerText = text;
            logBox.style.display = 'block';
            clearTimeout(window.logTimer);
            window.logTimer = setTimeout(() => {
                logBox.style.display = 'none';
            }, 3000);
        }


        // Tải mặc định màn hình Chẩn đoán khi mở trang
        window.onload = () => {
            loadView('chanDoan');
        };
    </script>
</body>
