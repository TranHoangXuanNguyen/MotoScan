<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOTOSCAN TAB - Chẩn đoán xe máy chuyên nghiệp | DTDAuto</title>
    <meta name="description" content="MOTOSCAN TAB - Thiết bị chẩn đoán và lập trình xe máy thông minh hàng đầu Việt Nam bởi DTDAuto">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Color Palette - Professional Dark Navy */
            --bg-body: #0a0e17;
            --bg-tablet: #0d1117;
            --bg-screen: #0f1923;
            --bg-sidebar: linear-gradient(180deg, #0a1628 0%, #061220 50%, #040d18 100%);
            --bg-content: #111d2e;
            --bg-card: linear-gradient(145deg, rgba(20, 40, 65, 0.8), rgba(12, 25, 45, 0.9));
            --bg-card-hover: linear-gradient(145deg, rgba(30, 55, 85, 0.9), rgba(18, 35, 58, 0.95));
            --bg-topbar: linear-gradient(180deg, #0d1a2d, #0a1525);
            --bg-statusbar: #060e1a;

            --accent-blue: #00a8ff;
            --accent-cyan: #00d4ff;
            --accent-orange: #ff8c00;
            --accent-green: #00e676;
            --accent-red: #ff3d57;
            --accent-yellow: #ffd600;
            --accent-purple: #a855f7;

            --text-primary: #e8edf5;
            --text-secondary: #8899b0;
            --text-muted: #556680;
            --text-accent: #00c8ff;

            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-card: rgba(0, 168, 255, 0.15);
            --border-active: rgba(0, 168, 255, 0.5);

            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-card-hover: 0 8px 32px rgba(0, 120, 255, 0.2);
            --shadow-glow: 0 0 20px rgba(0, 168, 255, 0.15);

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 20px;

            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-body);
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(0, 80, 160, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 120, 200, 0.05) 0%, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            user-select: none;
        }

        /* ========== TABLET FRAME ========== */
        .tablet-frame {
            width: 1040px;
            height: 660px;
            background: var(--bg-tablet);
            border-radius: 28px;
            padding: 14px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.04);
            position: relative;
        }

        .tablet-frame::before {
            content: '';
            position: absolute;
            top: 50%;
            right: 6px;
            transform: translateY(-50%);
            width: 3px;
            height: 40px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
        }

        .screen {
            width: 100%;
            height: 100%;
            background: var(--bg-screen);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ========== TOP BAR ========== */
        .top-bar {
            height: 44px;
            background: var(--bg-topbar);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            flex-shrink: 0;
        }

        .nav-controls {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .nav-btn {
            background: none;
            border: 1px solid transparent;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
        }

        .nav-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border-subtle);
        }

        .nav-btn:active {
            transform: scale(0.92);
            background: rgba(0, 168, 255, 0.1);
        }

        .nav-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .nav-separator {
            width: 1px;
            height: 20px;
            background: var(--border-subtle);
            margin: 0 6px;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .connection-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid rgba(0, 230, 118, 0.2);
            border-radius: 20px;
            font-size: 11px;
            color: var(--accent-green);
            font-weight: 600;
        }

        .connection-badge .pulse-dot {
            width: 7px;
            height: 7px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(0, 230, 118, 0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.85); }
        }

        .version-tag {
            color: var(--accent-orange);
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* ========== MAIN CONTAINER ========== */
        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            width: 230px;
            background: var(--bg-sidebar);
            color: white;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .brand {
            padding: 20px 16px 16px;
            text-align: center;
            border-bottom: 1px solid var(--border-subtle);
            position: relative;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            margin-bottom: 2px;
        }

        .brand-name {
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
        }

        .brand-sub {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--accent-orange);
            text-transform: uppercase;
        }

        .brand::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            opacity: 0.4;
        }

        .menu-list {
            list-style: none;
            padding: 8px 0;
            flex: 1;
            overflow-y: auto;
        }

        .menu-item {
            padding: 11px 16px;
            font-size: 12.5px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all var(--transition-normal);
            position: relative;
            margin: 2px 8px;
            border-radius: var(--radius-sm);
            letter-spacing: 0.2px;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .menu-item.active {
            background: linear-gradient(135deg, rgba(0, 168, 255, 0.2), rgba(0, 100, 200, 0.15));
            color: var(--accent-cyan);
            font-weight: 600;
            border: 1px solid rgba(0, 168, 255, 0.2);
            box-shadow: 0 0 16px rgba(0, 168, 255, 0.08);
        }

        .menu-item.active::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 60%;
            background: var(--accent-cyan);
            border-radius: 0 3px 3px 0;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        .menu-item .icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .menu-item .icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 12px 16px;
            font-size: 10px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-subtle);
            text-align: center;
            line-height: 1.5;
        }

        .sidebar-footer b {
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* ========== CONTENT AREA ========== */
        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: var(--bg-content);
            background-image:
                radial-gradient(ellipse at 30% 0%, rgba(0, 100, 200, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 100%, rgba(0, 80, 160, 0.03) 0%, transparent 50%);
        }

        .content-area::-webkit-scrollbar {
            width: 5px;
        }

        .content-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .content-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .content-area::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .content-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .content-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .content-title .title-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-blue);
        }

        .content-title .title-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .content-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        /* ========== CARDS ========== */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-card);
            box-shadow: var(--shadow-card);
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-smooth);
            height: 145px;
            text-align: center;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 168, 255, 0.3), transparent);
            opacity: 0;
            transition: opacity var(--transition-normal);
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(0, 168, 255, 0.08) 0%, transparent 70%);
            opacity: 0;
            transition: opacity var(--transition-normal);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-card-hover);
            border-color: var(--border-active);
            background: var(--bg-card-hover);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:hover::after {
            opacity: 1;
        }

        .card:active {
            transform: translateY(-1px) scale(0.98);
            transition-duration: 0.08s;
        }

        .card-icon {
            width: 54px;
            height: 54px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .card-icon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.3));
        }

        .card-title {
            font-size: 12px;
            color: var(--text-primary);
            font-weight: 600;
            line-height: 1.35;
            position: relative;
            z-index: 1;
            letter-spacing: 0.1px;
        }

        /* Card animation stagger */
        .card {
            animation: cardEnter 0.4s ease-out backwards;
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ========== STATUS BAR ========== */
        .status-bar {
            height: 28px;
            background: var(--bg-statusbar);
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            border-top: 1px solid var(--border-subtle);
            flex-shrink: 0;
            font-family: 'JetBrains Mono', monospace;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.green {
            background: var(--accent-green);
            box-shadow: 0 0 8px rgba(0, 230, 118, 0.5);
        }

        .status-dot.blue {
            background: var(--accent-blue);
            box-shadow: 0 0 8px rgba(0, 168, 255, 0.5);
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--text-muted);
        }

        .status-right span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ========== LOG OVERLAY ========== */
        #log-overlay {
            position: absolute;
            bottom: 45px;
            right: 25px;
            background: rgba(6, 14, 26, 0.95);
            color: var(--accent-green);
            padding: 10px 16px;
            border-radius: var(--radius-md);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            display: none;
            z-index: 100;
            border: 1px solid rgba(0, 230, 118, 0.2);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            max-width: 360px;
        }

        #log-overlay::before {
            content: '>';
            margin-right: 6px;
            color: var(--accent-cyan);
            font-weight: 700;
        }

        /* ========== BREADCRUMB ========== */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 14px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .breadcrumb-item {
            cursor: pointer;
            transition: color var(--transition-fast);
        }

        .breadcrumb-item:hover {
            color: var(--accent-blue);
        }

        .breadcrumb-item.current {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .breadcrumb-separator {
            color: var(--text-muted);
            font-size: 10px;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1080px) {
            .tablet-frame {
                width: 95vw;
                height: auto;
                aspect-ratio: 16 / 10;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 8px;
            }
            .tablet-frame {
                width: 100%;
                height: auto;
                min-height: 500px;
                border-radius: 16px;
                padding: 8px;
            }
            .sidebar {
                width: 180px;
            }
            .grid-layout {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .card {
                height: 120px;
            }
        }
    </style>
</head>

                { id: "lang_ms", title: "Bahasa Melayu", iconKey: "lang_ms" }
            ],
            mauXeHonda: [
                { id: "ab_08_10", title: "AIR BLADE\n(2008 - 2010)", iconKey: "scooter" },
                { id: "ab_11_12", title: "AIR BLADE\n(2011 - 2012)", iconKey: "scooter" },
                { id: "ab_13_15", title: "AIR BLADE\n(2013 - 2015)", iconKey: "scooter" },
                { id: "ab_16_19", title: "AIR BLADE\n(2016 - 2019)", iconKey: "scooter" },
                { id: "ab_20_24", title: "AIR BLADE\n(2020 - 2024)", iconKey: "scooter" },
                { id: "sh_mode", title: "SH MODE\n(2013 - 2024)", iconKey: "scooter" },
                { id: "sh_125_150", title: "SH 125/150i\n(2012 - 2024)", iconKey: "scooter" },
                { id: "vision", title: "VISION\n(2011 - 2024)", iconKey: "scooter" },
                { id: "lead", title: "LEAD\n(2008 - 2024)", iconKey: "scooter" },
                { id: "pcx", title: "PCX 125/150\n(2014 - 2024)", iconKey: "scooter" },
                { id: "vario", title: "VARIO\n(2015 - 2024)", iconKey: "scooter" },
                { id: "winner", title: "WINNER X/150\n(2017 - 2024)", iconKey: "scooter" }
            ],
            traCuu: [
                { id: "lookup_code", title: "Tra cứu mã lỗi\nOBD / DTC", iconKey: "lookup" },
                { id: "calc_tool", title: "Bộ tính toán\nkỹ thuật", iconKey: "calculator" },
                { id: "wiring_dia", title: "Sơ đồ mạch điện\nECU / SCU / ABS", iconKey: "wiring" }
            ],
            thongTin: [
                { id: "about", title: "Giới thiệu\nMOTOSCAN TAB", iconKey: "info" },
                { id: "manual_doc", title: "Tài liệu\nhướng dẫn", iconKey: "manual" },
                { id: "sw_update", title: "Cập nhật\nphần mềm", iconKey: "update" }
            ],
            thaoTac: []
        };

        // ========== NAVIGATION STACK ==========
        let navStack = ['chanDoan'];
        let currentView = 'chanDoan';

        // ========== LOAD VIEW ==========
        function loadView(viewKey, element) {
            if (element) {
                document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
                element.classList.add('active');
            }

            // Track navigation
            if (currentView !== viewKey) {
                navStack.push(viewKey);
                currentView = viewKey;
            }

            const grid = document.getElementById('gridContent');
            const header = document.getElementById('contentHeader');
            grid.innerHTML = '';

            // Build header
            const viewInfo = viewTitles[viewKey] || viewTitles['chanDoan'];
            header.innerHTML = `
                <div class="content-header">
                    <div>
                        <div class="content-title">
                            <div class="title-icon">
                                <svg viewBox="0 0 24 24"><path d="M9.5 3A6.5 6.5 0 0 1 16 9.5c0 1.61-.59 3.09-1.56 4.23l.27.27h.79l5 5-1.5 1.5-5-5v-.79l-.27-.27A6.516 6.516 0 0 1 9.5 16 6.5 6.5 0 0 1 3 9.5 6.5 6.5 0 0 1 9.5 3m0 2C7 5 5 7 5 9.5S7 14 9.5 14 14 12 14 9.5 12 5 9.5 5z"/></svg>
                            </div>
                            ${viewInfo.title}
                        </div>
                        <div class="content-subtitle">${viewInfo.subtitle}</div>
                    </div>
                </div>
            `;

            const items = viewsData[viewKey];

            if (!items || items.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-muted);">
                        <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor" style="opacity:0.3; margin-bottom:12px;"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                        <div style="font-size:14px; font-weight:600; margin-bottom:4px;">Chưa có thao tác nào</div>
                        <div style="font-size:12px;">Lịch sử thao tác sẽ hiển thị tại đây</div>
                    </div>
                `;
                return;
            }

            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.04}s`;
                card.onclick = () => onCardClick(item.id, item.title, viewKey);

                const iconSvg = SVG_ICONS[item.iconKey] || SVG_ICONS['obd_conn'];

                card.innerHTML = `
                    <div class="card-icon">${iconSvg}</div>
                    <div class="card-title">${item.title.replace(/\n/g, '<br>')}</div>
                `;
                grid.appendChild(card);
            });
        }

        // ========== CARD CLICK HANDLER ==========
        function onCardClick(id, title, viewKey) {
            showLog(`[CLICK] ${title.replace('\n', ' ')}`);

            if (viewKey === 'nhaSanXuat' && id === 'honda') {
                loadView('mauXeHonda');
            } else {
                /*
                   =====================================================
                   KHU VỰC TÍCH HỢP THUẬT TOÁN VÀ KẾT NỐI API SCAN SAU NÀY
                   =====================================================
                */
            }
        }

        // ========== NAVIGATION ==========
        function goBack() {
            if (navStack.length > 1) {
                navStack.pop();
                const prevView = navStack[navStack.length - 1];
                currentView = prevView;

                // Find and activate corresponding menu item
                const menuMap = {
                    chanDoan: 'menu-chandoan',
                    thaoTac: 'menu-thaotac',
                    traCuu: 'menu-tracuu',
                    thongTin: 'menu-thongtin',
                    nhaSanXuat: 'menu-nhasanxuat',
                    ngonNgu: 'menu-ngonngu'
                };

                const menuId = menuMap[prevView];
                const menuEl = menuId ? document.getElementById(menuId) : null;
                if (menuEl) {
                    document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
                    menuEl.classList.add('active');
                }

                loadView(prevView);
                navStack.push(prevView); // loadView pushes, so we compensate
            }
        }

        function goHome() {
            navStack = ['chanDoan'];
            currentView = 'chanDoan';
            const firstMenuItem = document.getElementById('menu-chandoan');
            loadView('chanDoan', firstMenuItem);
        }

        function triggerAction(actionName) {
            showLog(`[ACTION] ${actionName}`);
        }

        // ========== LOG OVERLAY ==========
        function showLog(text) {
            const logBox = document.getElementById('log-overlay');
            logBox.innerText = text;
            logBox.style.display = 'block';
            clearTimeout(window.logTimer);
            window.logTimer = setTimeout(() => {
                logBox.style.display = 'none';
            }, 2500);
        }

        // ========== CLOCK ==========
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}`;
        }

        // ========== INIT ==========
        window.onload = () => {
            loadView('chanDoan');
            updateClock();
            setInterval(updateClock, 30000);
        };
    </script>
</body>
</html>
